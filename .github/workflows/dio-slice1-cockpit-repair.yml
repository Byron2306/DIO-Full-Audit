name: DIO Slice 1 Cockpit Repair

on:
  push:
    branches:
      - agent/dio-slice1-cockpit-repair
    paths:
      - 'cockpit_runtime.py'
      - 'scripts/serve_business_workbench.py'
      - 'dashboard/production_slice1.js'
      - 'dashboard/atlas_slice1.js'
      - 'tests/test_cockpit_runtime.py'
      - 'tests/test_slice1_cockpit_contracts.py'
      - '.github/workflows/dio-slice1-cockpit-repair.yml'
  pull_request:
    paths:
      - 'cockpit_runtime.py'
      - 'scripts/serve_business_workbench.py'
      - 'dashboard/production_slice1.js'
      - 'dashboard/atlas_slice1.js'
      - 'tests/test_cockpit_runtime.py'
      - 'tests/test_slice1_cockpit_contracts.py'
      - '.github/workflows/dio-slice1-cockpit-repair.yml'

jobs:
  slice1-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Check Python syntax
        run: python -m py_compile cockpit_runtime.py scripts/serve_business_workbench.py
      - name: Check browser script syntax
        run: |
          node --check dashboard/production_slice1.js
          node --check dashboard/atlas_slice1.js
      - name: Run Slice 1 cockpit contracts
        run: >-
          PYTHONNOUSERSITE=1 python -m pytest -q
          tests/test_cockpit_runtime.py
          tests/test_slice1_cockpit_contracts.py
