name: DIO Slice 3 Capital Support Atlas

on:
  pull_request:
    paths:
      - 'market_capital/**'
      - 'presence_core/**'
      - 'scripts/**'
      - 'dashboard/capital_support_slice3.js'
      - 'cockpit_runtime.py'
      - 'tests/test_slice3_*.py'
      - 'tests/test_slice2_commercial_spine_contracts.py'
      - 'tests/test_slice1_cockpit_contracts.py'
      - '.github/workflows/dio-slice3-capital-support-atlas.yml'
  workflow_dispatch:

jobs:
  slice3-capital-support-atlas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest httpx requests
      - name: Compile Slice 3 sources when present
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import py_compile
          paths=[]
          for pattern in ('market_capital/*.py','scripts/run_capital_support_discovery_cycle.py'):
              paths.extend(Path('.').glob(pattern))
          for p in paths:
              py_compile.compile(str(p), doraise=True)
          PY
      - name: Run Slice 3 focused tests and prior-slice regressions
        shell: bash
        run: |
          set -e
          TESTS=$(find tests -maxdepth 1 -type f -name 'test_slice3_*.py' -print | sort)
          if [ -n "$TESTS" ]; then
            PYTHONNOUSERSITE=1 python -m pytest -q $TESTS tests/test_slice2_commercial_spine_contracts.py tests/test_slice1_cockpit_contracts.py
          else
            echo 'No Slice 3 tests present yet'
          fi
      - name: Acceptance token
        run: echo DIO_SLICE_3_CAPITAL_SUPPORT_ATLAS_CI_VERIFIED
