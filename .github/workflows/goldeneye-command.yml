name: GoldenEye Command Contract

on:
  push:
    branches:
      - dio-c7-goldeneye-control-deck
    paths:
      - "dashboard/goldeneye-command.html"
      - "dashboard/goldeneye-command.css"
      - "dashboard/goldeneye-command.js"
      - "dashboard/goldeneye-command-hardening.js"
      - "dashboard/assets/dio-logo-cockpit.svg"
      - "scripts/serve_goldeneye.py"
      - "commerce/mandos.py"
      - "tests/test_goldeneye_command_contract.py"
      - "tests/test_goldeneye_control_deck.py"
      - ".github/workflows/goldeneye-command.yml"
  pull_request:
    paths:
      - "dashboard/goldeneye-command.html"
      - "dashboard/goldeneye-command.css"
      - "dashboard/goldeneye-command.js"
      - "dashboard/goldeneye-command-hardening.js"
      - "dashboard/assets/dio-logo-cockpit.svg"
      - "scripts/serve_goldeneye.py"
      - "commerce/mandos.py"
      - "tests/test_goldeneye_command_contract.py"
      - "tests/test_goldeneye_control_deck.py"
      - ".github/workflows/goldeneye-command.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax
        run: python -m py_compile scripts/serve_goldeneye.py commerce/mandos.py
      - name: JavaScript syntax
        run: |
          node --check dashboard/goldeneye-command.js
          node --check dashboard/goldeneye-command-hardening.js
      - name: GoldenEye command closure contract
        run: python tests/test_goldeneye_command_contract.py
      - name: GoldenEye intelligence and wrapper regressions
        run: python tests/test_goldeneye_control_deck.py
