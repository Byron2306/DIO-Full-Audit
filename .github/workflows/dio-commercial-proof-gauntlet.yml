name: DIO Commercial Proof Gauntlet

on:
  pull_request:
    paths:
      - "products/commercial_proof.py"
      - "products/commercial_proof_v1_1.py"
      - "scripts/run_commercial_proof_gauntlet.py"
      - "tests/test_commercial_proof.py"
      - "tests/test_commercial_proof_wtp_guard.py"
      - "config/commercial_proof/**"
      - "docs/DIO_COMMERCIAL_PROOF_GAUNTLET_V1.md"
      - ".github/workflows/dio-commercial-proof-gauntlet.yml"
  push:
    branches:
      - "agent/dio-commercial-proof-gauntlet-v1"
    paths:
      - "products/commercial_proof.py"
      - "products/commercial_proof_v1_1.py"
      - "scripts/run_commercial_proof_gauntlet.py"
      - "tests/test_commercial_proof.py"
      - "tests/test_commercial_proof_wtp_guard.py"
      - "config/commercial_proof/**"
      - "docs/DIO_COMMERCIAL_PROOF_GAUNTLET_V1.md"
      - ".github/workflows/dio-commercial-proof-gauntlet.yml"

jobs:
  commercial-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile commercial proof modules
        run: |
          python -m py_compile \
            products/commercial_proof.py \
            products/commercial_proof_v1_1.py \
            scripts/run_commercial_proof_gauntlet.py \
            tests/test_commercial_proof.py \
            tests/test_commercial_proof_wtp_guard.py
      - name: Run commercial truth-boundary tests
        run: python -m pytest -q tests/test_commercial_proof.py tests/test_commercial_proof_wtp_guard.py
