name: DIO Phase 15 Self-expanding Product Factory

on:
  push:
    paths:
      - "config/factory/**"
      - "config/portfolio/capability_catalog.json"
      - "schemas/dio_product_factory_spec.schema.json"
      - "products/factory/**"
      - "products/self_expanding_factory_gauntlet.py"
      - "scripts/run_self_expanding_product_factory_phase15.py"
      - "tests/test_self_expanding_product_factory_phase15.py"
      - "docs/DIO_SELF_EXPANDING_PRODUCT_FACTORY_PHASE15.md"
      - ".github/workflows/dio-self-expanding-product-factory-phase15.yml"
  pull_request:
    paths:
      - "config/factory/**"
      - "config/portfolio/capability_catalog.json"
      - "schemas/dio_product_factory_spec.schema.json"
      - "products/factory/**"
      - "products/self_expanding_factory_gauntlet.py"
      - "scripts/run_self_expanding_product_factory_phase15.py"
      - "tests/test_self_expanding_product_factory_phase15.py"
      - "docs/DIO_SELF_EXPANDING_PRODUCT_FACTORY_PHASE15.md"
      - ".github/workflows/dio-self-expanding-product-factory-phase15.yml"

jobs:
  phase15:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest jsonschema reportlab
      - run: python -m compileall products dio evidence scripts
      - run: python scripts/validate_profiles.py
      - run: python -m pytest -q tests/test_profile_expansion_phase12.py tests/test_ai_digital_trust_phase13.py tests/test_regulated_markets_phase14.py tests/test_self_expanding_product_factory_phase15.py
      - run: python scripts/run_self_expanding_product_factory_phase15.py --output /tmp/dio-phase15-self-expanding-product-factory
