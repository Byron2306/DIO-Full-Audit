[tool:pytest]
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=backend
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=json
    -ra
markers =
    unit: Unit tests (Layer 1) - Individual components
    integration: Integration tests (Layer 2) - Component interactions
    api: API tests (Layer 3) - REST endpoint functionality
    e2e: End-to-end tests (Layer 4) - Complete workflows
    performance: Performance tests (Layer 5) - Load and scalability
    security: Security-focused tests
    smoke: Basic functionality smoke tests
    slow: Slow-running tests (skip in CI)
    adversarial: Adversarial harness tests (AAB - Agentic Adversary Benchmark)
asyncio_mode = auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning
