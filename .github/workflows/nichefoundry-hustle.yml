name: DIO LINGUA Communication Learning

on:
  push:
    branches: ["agent/dio-nichefoundry-hustle"]
  pull_request:
    paths:
      - "config/marketing_sales_playbook.json"
      - "config/lingua_product_routes.json"
      - "config/vesper_voice_profiles.json"
      - "config/vesper_persona_lab.json"
      - "scripts/build_multichannel_campaign_factory.py"
      - "scripts/build_hustle_campaign_factory.py"
      - "scripts/build_lingua_hustle_campaign_factory.py"
      - "scripts/build_vesper_persona_lab.py"
      - "scripts/manage_vesper_persona_lab.py"
      - "scripts/lingua_marketing_learning.py"
      - "scripts/render_pending_hustle_reels.py"
      - "scripts/manage_mail_intent.py"
      - "scripts/dio_mail_branding.py"
      - "scripts/diagnose_vesper_presence.py"
      - "presence_core/**"
      - "adapters/lingua/lifecycle.py"
      - "adapters/lingua/communicator.py"
      - "adapters/lingua/interaction_regulator.py"
      - "adapters/lingua/persona_lab.py"
      - "README_PRESENCE.md"
      - "docs/HF_SPACE_DEPLOYMENT.md"
      - "tests/test_multichannel_campaign_factory.py"
      - "tests/test_nichefoundry_hustle_factory.py"
      - "tests/test_lingua_marketing_learning.py"
      - "tests/test_lingua_public_communicator.py"
      - "tests/test_lingua_interaction_regulator.py"
      - "tests/test_presence_engine.py"
      - "tests/test_vesper_presence_diagnostic.py"
      - "tests/test_vesper_voice.py"
      - "tests/test_vesper_voice_rendering.py"
      - "tests/test_vesper_persona_lab.py"
      - "tests/test_vesper_persona_presence_integration.py"
      - "ops/systemd/user/dio-marketing-factory.service"
      - ".github/workflows/nichefoundry-hustle.yml"
  workflow_dispatch:

jobs:
  lingua-communication-factory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pillow pytest httpx
      - name: Compile marketing, Vesper, mail and LINGUA seams
        run: |
          python -m compileall -q \
            scripts/build_multichannel_campaign_factory.py \
            scripts/build_hustle_campaign_factory.py \
            scripts/build_lingua_hustle_campaign_factory.py \
            scripts/build_vesper_persona_lab.py \
            scripts/manage_vesper_persona_lab.py \
            scripts/lingua_marketing_learning.py \
            scripts/render_pending_hustle_reels.py \
            scripts/manage_mail_intent.py \
            scripts/dio_mail_branding.py \
            scripts/diagnose_vesper_presence.py \
            adapters/lingua/lifecycle.py \
            adapters/lingua/communicator.py \
            adapters/lingua/interaction_regulator.py \
            adapters/lingua/persona_lab.py \
            presence_core
      - name: Run legacy, persuasion, Presence, Persona Lab and LINGUA tests
        run: |
          pytest -q \
            tests/test_multichannel_campaign_factory.py \
            tests/test_nichefoundry_hustle_factory.py \
            tests/test_lingua_marketing_learning.py \
            tests/test_lingua_public_communicator.py \
            tests/test_lingua_interaction_regulator.py \
            tests/test_presence_engine.py \
            tests/test_vesper_presence_diagnostic.py \
            tests/test_vesper_voice.py \
            tests/test_vesper_voice_rendering.py \
            tests/test_vesper_persona_lab.py \
            tests/test_vesper_persona_presence_integration.py
      - name: Smoke NicheFoundry and Vesper Persona Lab without external effects
        run: |
          out="$(mktemp -d)"
          python -m scripts.build_lingua_hustle_campaign_factory --no-reels --no-observe-market --limit 1 --output "$out/marketing"
          python scripts/build_vesper_persona_lab.py --output "$out/persona"
          python - "$out" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          registry=json.loads((root/'marketing'/'CREATIVE_FAMILY_REGISTRY.json').read_text())
          assert registry['schema']=='dio.marketing.creative_family_registry.v3'
          assert registry['summary']['commercial_failures']==0
          assert registry['summary']['validation_failures']==0
          assert registry['summary']['lingua_semantic_objects_registered']==10
          assert registry['summary']['lingua_registration_errors']==0
          assert registry['summary']['lingua_reuse_hits']==0
          family=registry['families'][0]
          assert family['commercial_quality']['all_channels_passed'] is True
          assert len(family['sales_scenes'])==5
          assert family['governance']['direct_learning_to_execution'] is False
          assert family['governance']['learning_reuse']=='held_drafts_only'
          request=json.loads((root/'marketing'/'evidex-pack'/'ngo-programme-leads'/'NICHEFOUNDRY_PRODUCTION_REQUEST.json').read_text())
          assert request['script_brief']['first_hook_deadline_seconds']==2
          assert request['release']['state']=='held'
          assert request['spend']['state']=='disabled'
          assert registry['lingua_learning']['publication'] is False
          assert registry['lingua_learning']['spend'] is False

          lab=json.loads((root/'persona'/'VESPER_PERSONA_LAB_BUILD.json').read_text())
          matrix=json.loads((root/'persona'/'VESPER_PERSONA_EXPERIMENT_MATRIX.json').read_text())
          assert lab['schema']=='dio.vesper.persona_lab_build.v1'
          assert lab['avatar_request_count']==3
          assert lab['assets_generated'] is False
          assert lab['publication_authorized'] is False
          assert lab['spend_authorized'] is False
          assert len(matrix['cells'])==9
          assert matrix['automatic_promotion'] is False
          assert matrix['human_approval_required'] is True
          print('VESPER_PERSONA_LAB_READY avatars=',lab['avatar_request_count'],'cells=',len(matrix['cells']))
          PY
