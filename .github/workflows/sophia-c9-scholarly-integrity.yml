name: Sophia C9 Scholarly Integrity

on:
  push:
    branches:
      - dio-c9-sophia-scholarly-integrity
    paths:
      - "adapters/sophia/product_integrity.py"
      - "scripts/manage_sophia_commercial.py"
      - "scripts/run_sophia_scholarly_integrity_c9.py"
      - "scripts/prepare_sophia_c9_revision_delivery.py"
      - "config/sophia_service.json"
      - "sites/sophia/**"
      - "tests/test_sophia_c9_scholarly_integrity.py"
      - "tests/test_sophia_c9_support_monotonicity.py"
      - "tests/test_sophia_c9_commercial_gate.py"
      - "docs/SOPHIA_SCHOLARLY_INTEGRITY_C9.md"
      - ".github/workflows/sophia-c9-scholarly-integrity.yml"
  pull_request:
    paths:
      - "adapters/sophia/product_integrity.py"
      - "scripts/manage_sophia_commercial.py"
      - "scripts/run_sophia_scholarly_integrity_c9.py"
      - "scripts/prepare_sophia_c9_revision_delivery.py"
      - "config/sophia_service.json"
      - "sites/sophia/**"
      - "tests/test_sophia_c9_scholarly_integrity.py"
      - "tests/test_sophia_c9_support_monotonicity.py"
      - "tests/test_sophia_c9_commercial_gate.py"
      - "docs/SOPHIA_SCHOLARLY_INTEGRITY_C9.md"
      - ".github/workflows/sophia-c9-scholarly-integrity.yml"

jobs:
  scholarly-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile C9 product code
        run: |
          python -m py_compile \
            adapters/sophia/product_integrity.py \
            scripts/manage_sophia_commercial.py \
            scripts/run_sophia_scholarly_integrity_c9.py \
            scripts/prepare_sophia_c9_revision_delivery.py
      - name: Run C9 scholarly integrity adversarial proof
        run: |
          python -m unittest -v \
            tests.test_sophia_c9_scholarly_integrity \
            tests.test_sophia_c9_support_monotonicity \
            tests.test_sophia_c9_commercial_gate
      - name: Verify Sophia public integrity surface
        run: |
          grep -Fq "Integrity you can inspect." sites/sophia/index.html
          grep -Fq "Ten artifacts. One evidence trail." sites/sophia/index.html
          grep -Fq "No detector cosplay." sites/sophia/index.html
          grep -Fq "No plagiarism verdict from similarity." sites/sophia/index.html
          grep -Fq "The author revises. Sophia checks the movement." sites/sophia/index.html
      - name: Verify service authority boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c = json.loads(Path('config/sophia_service.json').read_text())
          assert c['limits']['included_revision_rounds'] == 1
          assert len(c['deliverables']) == 10
          assert c['integrity_contract']['ghostwriting'] is False
          assert c['integrity_contract']['misconduct_detection_authority'] is False
          assert c['integrity_contract']['automatic_source_promotion'] is False
          assert c['integrity_contract']['authorship_preservation_index_is_forensic_detector'] is False
          print('Sophia C9 authority boundaries verified')
          PY
