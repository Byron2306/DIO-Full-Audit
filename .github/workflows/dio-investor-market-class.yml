name: DIO Investor Market Class

on:
  pull_request:
    paths:
      - 'config/dio_marketing_integration.json'
      - 'config/product_layers.json'
      - 'scripts/run_dio_marketing_integration.py'
      - 'scripts/settle_dio_marketing_campaign.py'
      - 'tests/test_dio_marketing_integration.py'
      - 'tests/test_dio_investor_market_class_activation.py'
      - '.github/workflows/dio-investor-market-class.yml'
  workflow_dispatch:

jobs:
  investor-market-class:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run investor market class tests
        run: |
          python -m unittest tests.test_dio_marketing_integration -v
          python -m unittest tests.test_dio_investor_market_class_activation -v
