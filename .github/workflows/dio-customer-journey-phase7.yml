name: DIO Customer Journey Phase 7

on:
  push:
    branches:
      - agent/dio-customer-journey-phase7
  pull_request:
    paths:
      - 'presence_core/organ_adapter_gauntlet.py'
      - 'tests/test_customer_journey_phase7.py'
      - 'tests/test_customer_journey_phase7_native_organs.py'
      - 'tests/test_customer_journey_phase7_external_organs.py'
      - 'docs/DIO_CUSTOMER_JOURNEY_PHASE7.md'
      - '.github/workflows/dio-customer-journey-phase7.yml'

jobs:
  phase7-contract-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest jsonschema
      - name: Compile Phase 7 contract
        run: |
          python -m py_compile \
            presence_core/organ_adapter_gauntlet.py \
            tests/test_customer_journey_phase7.py \
            tests/test_customer_journey_phase7_native_organs.py \
            tests/test_customer_journey_phase7_external_organs.py
      - name: Run Phase 7 contract and repository-native proofs
        run: |
          python -m pytest -q \
            tests/test_customer_journey_phase7.py \
            tests/test_customer_journey_phase7_native_organs.py \
            tests/test_customer_journey_phase7_external_organs.py

  evidex-main-repo:
    runs-on: ubuntu-latest
    env:
      EVIDEX_SHA: c2754b37ca32e803d84e733b5d59207fdcb17841
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned Evidex organ
        run: |
          root="$RUNNER_TEMP/phase7-evidex"
          git init "$root"
          git -C "$root" remote add origin https://github.com/Byron2306/Evidex.git
          git -C "$root" fetch --depth 1 origin "$EVIDEX_SHA"
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$EVIDEX_SHA"
          echo "PHASE7_EVIDEX_ROOT=$root" >> "$GITHUB_ENV"
      - name: Install Evidex runtime
        run: |
          python -m pip install pytest
          python -m pip install -r "$PHASE7_EVIDEX_ROOT/requirements.txt"
          python -m pip install -e "$PHASE7_EVIDEX_ROOT"
      - name: Execute and seal canonical Evidex
        run: |
          python -m pytest -q \
            tests/test_customer_journey_phase7_external_organs.py \
            -k real_evidex

  homs-main-repo:
    runs-on: ubuntu-latest
    env:
      HOMS_SHA: a3ea3f627d860fc7b13e2d95f6632f914938c8de
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch pinned HOMS organ
        run: |
          root="$RUNNER_TEMP/phase7-homs"
          git init "$root"
          git -C "$root" remote add origin https://github.com/Byron2306/NoEdge-Multi-Hymark.git
          git -C "$root" fetch --depth 1 origin "$HOMS_SHA"
          git -C "$root" checkout --detach FETCH_HEAD
          test "$(git -C "$root" rev-parse HEAD)" = "$HOMS_SHA"
          echo "PHASE7_HOMS_ROOT=$root" >> "$GITHUB_ENV"
      - name: Install HOMS runtime
        run: |
          python -m pip install pytest
          python -m pip install -r "$PHASE7_HOMS_ROOT/requirements.txt"
      - name: Execute and seal canonical HOMS assessment and learning
        run: |
          python -m pytest -q \
            tests/test_customer_journey_phase7_external_organs.py \
            -k real_homs
