name: DIO Android

on:
  push:
    branches:
      - agent/dio-android-native-client
    paths:
      - 'android/dio-mobile/**'
      - 'tests/test_dio_android_contract.py'
      - '.github/workflows/dio-android.yml'
  pull_request:
    paths:
      - 'android/dio-mobile/**'
      - 'tests/test_dio_android_contract.py'
      - '.github/workflows/dio-android.yml'

jobs:
  android-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install contract test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run Android repository contract
        run: PYTHONNOUSERSITE=1 python -m pytest -q tests/test_dio_android_contract.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Android 17.0 SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Compile Android client
        working-directory: android/dio-mobile
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation contracts
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: cd android/dio-mobile && gradle --no-daemon :app:connectedDebugAndroidTest

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dio-android-debug-apk
          path: android/dio-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
