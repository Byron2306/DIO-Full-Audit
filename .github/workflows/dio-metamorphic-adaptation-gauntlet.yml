name: DIO Metamorphic Adaptation Gauntlet

on:
  pull_request:
    branches:
      - agent/dio-public-launch-rail
  push:
    branches:
      - agent/dio-metamorphic-adaptation-gauntlet

jobs:
  contracts-red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema
      - name: Run metamorphic adaptation contract tests
        run: python -m pytest -q tests/test_metamorphic_adaptation_contracts.py
