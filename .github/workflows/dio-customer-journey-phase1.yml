name: DIO Customer Journey Phase 1

on:
  pull_request:
    paths:
      - "presence_core/customer_cases.py"
      - "presence_core/journey_core.py"
      - "tests/test_customer_journey_phase1.py"
      - "docs/DIO_CUSTOMER_JOURNEY_SPINE_MASTER_PLAN.md"
      - "docs/DIO_CUSTOMER_JOURNEY_PHASE1.md"
      - ".github/workflows/dio-customer-journey-phase1.yml"
  push:
    branches:
      - "agent/dio-customer-journey-phase1"
    paths:
      - "presence_core/customer_cases.py"
      - "presence_core/journey_core.py"
      - "tests/test_customer_journey_phase1.py"
      - "docs/DIO_CUSTOMER_JOURNEY_SPINE_MASTER_PLAN.md"
      - "docs/DIO_CUSTOMER_JOURNEY_PHASE1.md"
      - ".github/workflows/dio-customer-journey-phase1.yml"

jobs:
  journey-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile Journey Core
        run: |
          python -m py_compile \
            presence_core/customer_cases.py \
            presence_core/journey_core.py \
            tests/test_customer_journey_phase1.py
      - name: Run Phase 1 Journey Core tests
        run: python -m pytest -q tests/test_customer_journey_phase1.py
