name: DIO Canon Extension ProductGrade

on:
  push:
    branches:
      - agent/dio-canon-extension-productgrade-gauntlet
  pull_request:
    paths:
      - 'products/canon_extension_product_grade.py'
      - 'products/canon_extension_proof_seal.py'
      - 'products/canon_extension_native_profiles.py'
      - 'products/canon_extension_native_product_grade.py'
      - 'products/canon_extension_materializer.py'
      - 'products/canon_portfolio_product_grade.py'
      - 'products/product_grade_gauntlet.py'
      - 'evidence/historical/PROFESSIONAL_EVIDENCE_53_X3_ANCHOR.json'
      - 'scripts/materialize_canon_extensions.py'
      - 'scripts/run_canon_extension_product_grade.py'
      - 'scripts/run_canon_extension_native_product_grade.py'
      - 'scripts/run_canon_portfolio_product_grade.py'
      - 'scripts/seal_canon_extension_proofs.py'
      - 'tests/test_product_grade_gauntlet_artifact_paths.py'
      - 'tests/test_canon_extension_aggregate_cli_provenance.py'
      - 'tests/test_canon_extension_materializer.py'
      - 'tests/test_canon_extension_product_grade.py'
      - 'tests/test_canon_extension_native_product_grade.py'
      - 'tests/test_canon_extension_dual_bound_receipt.py'
      - 'tests/test_canon_extension_15x3_promotion.py'
      - 'tests/test_canon_extension_native_product_grade_cli.py'
      - 'tests/test_canon_portfolio_68_product_grade.py'
      - 'tests/test_canon_portfolio_product_grade_cli.py'
      - '.github/workflows/dio-canon-extension-productgrade.yml'

jobs:
  canon-extension-productgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test and ProductGrade runtime dependencies
        run: python -m pip install pytest 'jsonschema>=4.23,<5' 'httpx==0.28.1' -r requirements-format-core.txt

      - name: Run canon extension ProductGrade tests
        run: >-
          PYTHONNOUSERSITE=1 python -m pytest -q
          tests/test_product_grade_gauntlet_artifact_paths.py
          tests/test_canon_extension_aggregate_cli_provenance.py
          tests/test_canon_extension_materializer.py
          tests/test_canon_extension_product_grade.py
          tests/test_canon_extension_native_product_grade.py
          tests/test_canon_extension_dual_bound_receipt.py
          tests/test_canon_extension_15x3_promotion.py
          tests/test_canon_extension_native_product_grade_cli.py
          tests/test_canon_portfolio_68_product_grade.py
          tests/test_canon_portfolio_product_grade_cli.py

      - name: Capture immutable historical 53x3 anchor hash
        shell: bash
        run: |
          echo "HISTORICAL_53_ANCHOR_SHA256=$(sha256sum evidence/historical/PROFESSIONAL_EVIDENCE_53_X3_ANCHOR.json | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Materialize 11 receipt-bound canon extensions
        run: PYTHONNOUSERSITE=1 python scripts/materialize_canon_extensions.py --require-all

      - name: Verify 11 canon materializations exist
        shell: bash
        run: |
          SITE_COUNT="$(find state/product_portfolio/canon_extensions -path '*/site/index.html' -type f | wc -l)"
          RECEIPT_COUNT="$(find state/product_portfolio/canon_extensions -name 'CANON_EXTENSION_MATERIALIZATION_RECEIPT.json' -type f | wc -l)"
          echo "CANON_EXTENSION_SITE_COUNT=$SITE_COUNT"
          echo "CANON_EXTENSION_MATERIALIZATION_RECEIPT_COUNT=$RECEIPT_COUNT"
          test "$SITE_COUNT" -eq 11
          test "$RECEIPT_COUNT" -eq 11

      - name: Seal current receipt-bound canon-extension artifacts
        run: PYTHONNOUSERSITE=1 python scripts/seal_canon_extension_proofs.py --require-all

      - name: Execute native 15x3 ProductGrade
        run: >-
          PYTHONNOUSERSITE=1 python scripts/run_canon_extension_native_product_grade.py
          --output state/product_grade/canon_extensions
          --require-all

      - name: Verify 45 buyer artifacts exist
        shell: bash
        run: |
          BUYER_COUNT="$(find state/product_grade/canon_extensions -path '*/variants/*/customer_delivery/index.html' -type f | wc -l)"
          echo "CANON_EXTENSION_BUYER_ARTIFACT_COUNT=$BUYER_COUNT"
          test "$BUYER_COUNT" -eq 45

      - name: Aggregate all 15 canon extensions
        run: >-
          PYTHONNOUSERSITE=1 python scripts/run_canon_extension_product_grade.py
          --output state/product_grade/canon_extension_aggregate
          --studio-receipt state/product_grade/studio_product_grade_support/PRODUCT_GRADE_PORTFOLIO_RECEIPT.json
          --require-proof
          --require-all

      - name: Seal immutable 68x3 portfolio receipt
        run: >-
          PYTHONNOUSERSITE=1 python scripts/run_canon_portfolio_product_grade.py
          --extension-receipt state/product_grade/canon_extension_aggregate/CANON_EXTENSION_PRODUCT_GRADE_RECEIPT.json
          --output state/product_grade/canon_portfolio
          --require-all

      - name: Verify 68x3 acceptance tokens and historical immutability
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          materialized = json.loads(Path('state/product_portfolio/canon_extensions/CANON_EXTENSION_MATERIALIZATION_BATCH_RECEIPT.json').read_text())
          native = json.loads(Path('state/product_grade/canon_extensions/NATIVE_CANON_EXTENSION_PRODUCT_GRADE_BATCH_RECEIPT.json').read_text())
          studios = json.loads(Path('state/product_grade/studio_product_grade_support/PRODUCT_GRADE_PORTFOLIO_RECEIPT.json').read_text())
          extensions = json.loads(Path('state/product_grade/canon_extension_aggregate/CANON_EXTENSION_PRODUCT_GRADE_RECEIPT.json').read_text())
          portfolio = json.loads(Path('state/product_grade/canon_portfolio/CANON_PORTFOLIO_68_X3_PRODUCT_GRADE_RECEIPT.json').read_text())

          assert materialized['acceptance_token'] == 'DIO_CANON_EXTENSION_11_MATERIALIZED'
          assert materialized['materialized_count'] == 11
          assert materialized['refuse_count'] == 0
          assert studios['acceptance_token'] == 'DIO_PRODUCT_GRADE_VERIFIED'
          assert native['acceptance_token'] == 'DIO_CANON_EXTENSION_15_X3_PRODUCT_GRADE_VERIFIED'
          assert native['verified_journey_count'] == 45
          assert native['product_grade_verified_count'] == 15
          assert extensions['acceptance_token'] == 'DIO_CANON_EXTENSION_15_X3_PRODUCT_GRADE_VERIFIED'
          assert extensions['verified_journey_count'] == 45
          assert extensions['product_grade_verified_count'] == 15
          assert portfolio['acceptance_token'] == 'DIO_CANON_PORTFOLIO_68_X3_PRODUCT_GRADE_VERIFIED'
          assert portfolio['canon_product_count'] == 68
          assert portfolio['controlled_journey_count'] == 204
          assert portfolio['verified_journey_count'] == 204
          assert portfolio['product_grade_verified_count'] == 68
          assert portfolio['historical_53_receipt_mutated'] is False
          print('DIO_CANON_EXTENSION_11_MATERIALIZED')
          print('DIO_CANON_EXTENSION_15_X3_PRODUCT_GRADE_VERIFIED')
          print('DIO_CANON_PORTFOLIO_68_X3_PRODUCT_GRADE_VERIFIED')
          print('DIO_PORTFOLIO_PRODUCT_GRADE_VERIFIED products=68 journeys=204')
          PY
          test "$(sha256sum evidence/historical/PROFESSIONAL_EVIDENCE_53_X3_ANCHOR.json | awk '{print $1}')" = "$HISTORICAL_53_ANCHOR_SHA256"

      - name: Upload ProductGrade evidence and buyer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dio-canon-68x3-productgrade-evidence
          path: |
            state/product_portfolio/canon_extensions/**/site/index.html
            state/product_portfolio/canon_extensions/**/CANON_EXTENSION_MATERIALIZATION_RECEIPT.json
            state/product_portfolio/canon_extensions/**/CANON_EXTENSION_PROOF_RECEIPT.json
            state/product_portfolio/canon_extensions/CANON_EXTENSION_MATERIALIZATION_BATCH_RECEIPT.json
            state/product_grade/studio_product_grade_support/**/*.json
            state/product_grade/canon_extensions/**/variants/**/customer_delivery/index.html
            state/product_grade/canon_extensions/**/*.json
            state/product_grade/canon_extension_aggregate/**/*.json
            state/product_grade/canon_portfolio/**/*.json
          if-no-files-found: error
          retention-days: 30