name: Sophia C10 Longitudinal Speculum

on:
  push:
    branches:
      - dio-c10-sophia-longitudinal-speculum
    paths:
      - "adapters/sophia/__init__.py"
      - "adapters/sophia/longitudinal_speculum.py"
      - "adapters/sophia/c10_gate.py"
      - "adapters/sophia/c10_scope.py"
      - "adapters/sophia/scholarly_topology.py"
      - "scripts/run_sophia_longitudinal_speculum_c10.py"
      - "scripts/run_sophia_c10_topology.py"
      - "scripts/prove_sophia_c10_live.py"
      - "tests/test_sophia_c10_longitudinal_speculum.py"
      - "tests/test_sophia_c10_lineage_isolation.py"
      - "tests/test_sophia_c10_scholarly_topology.py"
      - "tests/test_sophia_c10_decision_scoping.py"
      - "tests/test_sophia_c10_live_proof.py"
      - "docs/SOPHIA_LONGITUDINAL_SPECULUM_C10.md"
      - "docs/SOPHIA_C10_SCHOLARLY_TOPOLOGY.md"
      - ".github/workflows/sophia-c10-longitudinal-speculum.yml"
  pull_request:
    paths:
      - "adapters/sophia/__init__.py"
      - "adapters/sophia/longitudinal_speculum.py"
      - "adapters/sophia/c10_gate.py"
      - "adapters/sophia/c10_scope.py"
      - "adapters/sophia/scholarly_topology.py"
      - "scripts/run_sophia_longitudinal_speculum_c10.py"
      - "scripts/run_sophia_c10_topology.py"
      - "scripts/prove_sophia_c10_live.py"
      - "tests/test_sophia_c10_longitudinal_speculum.py"
      - "tests/test_sophia_c10_lineage_isolation.py"
      - "tests/test_sophia_c10_scholarly_topology.py"
      - "tests/test_sophia_c10_decision_scoping.py"
      - "tests/test_sophia_c10_live_proof.py"
      - "docs/SOPHIA_LONGITUDINAL_SPECULUM_C10.md"
      - "docs/SOPHIA_C10_SCHOLARLY_TOPOLOGY.md"
      - ".github/workflows/sophia-c10-longitudinal-speculum.yml"

jobs:
  longitudinal-speculum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile C10 code
        run: |
          python -m py_compile \
            adapters/sophia/__init__.py \
            adapters/sophia/longitudinal_speculum.py \
            adapters/sophia/c10_gate.py \
            adapters/sophia/c10_scope.py \
            adapters/sophia/scholarly_topology.py \
            scripts/run_sophia_longitudinal_speculum_c10.py \
            scripts/run_sophia_c10_topology.py \
            scripts/prove_sophia_c10_live.py
      - name: Re-run C9 integrity contracts inherited by C10
        run: |
          python -m unittest -v \
            tests.test_sophia_c9_scholarly_integrity \
            tests.test_sophia_c9_support_monotonicity \
            tests.test_sophia_c9_commercial_gate
      - name: Run C10 longitudinal, topology, decision, and proof adversarial contracts
        run: |
          python -m unittest -v \
            tests.test_sophia_c10_longitudinal_speculum \
            tests.test_sophia_c10_lineage_isolation \
            tests.test_sophia_c10_scholarly_topology \
            tests.test_sophia_c10_decision_scoping \
            tests.test_sophia_c10_live_proof
      - name: Verify hardened scope semantics
        run: |
          python - <<'PY'
          from adapters.sophia.longitudinal_speculum import _scope_signature
          association = _scope_signature('Structured feedback is associated with improved writing outcomes.', 'associational')
          causal = _scope_signature('Structured feedback improves writing outcomes.', 'causal')
          strong = _scope_signature('Structured feedback causes improved writing outcomes.', 'causal')
          assert association['causal'] is False, association
          assert association['associational'] is True, association
          assert causal['causal'] is True, causal
          assert strong['strong_causal_syntax'] is True, strong
          print('C10 governed scope semantics verified')
          PY
      - name: Verify C10 authority and fail-closed proof language
        run: |
          grep -Fq "Ambiguous continuity remains unresolved until a human confirms or rejects it" adapters/sophia/longitudinal_speculum.py
          grep -Fq "Resolve ambiguous claim-lineage candidates before C10 approval" adapters/sophia/c10_gate.py
          grep -Fq "not a forensic authorship or misconduct determination" adapters/sophia/longitudinal_speculum.py
          grep -Fq "topology hypotheses, not findings of author intent" adapters/sophia/scholarly_topology.py
          grep -Fq "Human decisions are required before release" adapters/sophia/c10_gate.py
          grep -Fq "C10_LONGITUDINAL_PROOF_NOT_YET_ESTABLISHED" scripts/prove_sophia_c10_live.py
