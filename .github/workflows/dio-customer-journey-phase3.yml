name: DIO Customer Journey Phase 3

on:
  push:
    branches:
      - agent/dio-customer-journey-phase3
  pull_request:
    paths:
      - 'presence_core/settlement_truth.py'
      - 'tests/test_customer_journey_phase3.py'
      - 'docs/DIO_CUSTOMER_JOURNEY_PHASE3.md'
      - '.github/workflows/dio-customer-journey-phase3.yml'

jobs:
  settlement-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile Phase 3 contracts
        run: |
          python -m py_compile \
            presence_core/journey_core.py \
            presence_core/intake_scope_quote.py \
            tests/test_customer_journey_phase3.py
          if [ -f presence_core/settlement_truth.py ]; then
            python -m py_compile presence_core/settlement_truth.py
          fi
      - name: Run Phase 3 contract tests
        run: python -m pytest -q tests/test_customer_journey_phase3.py
