name: DIO Customer Journey Phase 7

concurrency:
  group: dio-customer-journey-phase7-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - agent/dio-customer-journey-phase7
  pull_request:
    paths:
      - 'presence_core/organ_adapter_gauntlet.py'
      - 'tests/test_customer_journey_phase7.py'
      - 'tests/test_customer_journey_phase7_native_organs.py'
      - 'tests/test_customer_journey_phase7_external_organs.py'
      - 'docs/DIO_CUSTOMER_JOURNEY_PHASE7.md'
      - '.github/workflows/dio-customer-journey-phase7.yml'

jobs:
  phase7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest jsonschema
      - name: Compile Phase 7 contract
        run: |
          python -m py_compile \
            presence_core/organ_adapter_gauntlet.py \
            tests/test_customer_journey_phase7.py \
            tests/test_customer_journey_phase7_native_organs.py \
            tests/test_customer_journey_phase7_external_organs.py
      - name: Run Phase 7 contract and in-repo native organ proofs
        run: |
          python -m pytest -q \
            tests/test_customer_journey_phase7.py \
            tests/test_customer_journey_phase7_native_organs.py \
            tests/test_customer_journey_phase7_external_organs.py

  evidex-main-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Byron2306/Evidex
          ref: c2754b37ca32e803d84e733b5d59207fdcb17841
          path: external/evidex
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Evidex runtime
        run: python -m pip install -r external/evidex/requirements.txt
      - name: Execute canonical Evidex engine
        env:
          SUMMARY_USE_LLM: '0'
          PYTHONPATH: external/evidex/src
        run: |
          python -m evidence_pack_engine.cli generate \
            --intake external/evidex/samples/grant_reporting/intake.yaml \
            --uploads external/evidex/samples/grant_reporting/uploads \
            --out external/evidex/phase7-output
      - name: Seal Evidex artifacts through DIO Phase 7
        run: |
          python - <<'PY'
          from pathlib import Path
          from presence_core.organ_adapter_gauntlet import seal_native_execution, validate_execution_evidence, VERIFIED_NATIVE
          root = Path("external/evidex/phase7-output")
          artifacts = [p for p in root.rglob("*") if p.is_file() and (p.suffix == ".zip" or p.name == "QUALITY_REPORT.txt")]
          assert artifacts, "Evidex produced no sealable artifacts"
          evidence = seal_native_execution(
              "evidex_evidence",
              fulfilment_request_sha256="9"*64,
              execution_profile_sha256="a"*64,
              artifacts=[{"artifact_id": f"evidex-{i}", "kind": "application/octet-stream", "path": p} for i,p in enumerate(artifacts,1)],
              evidence_refs=["external-repo:Byron2306/Evidex@c2754b37ca32e803d84e733b5d59207fdcb17841"],
          )
          verdict = validate_execution_evidence("evidex_evidence", evidence, expected_request_sha256="9"*64, expected_profile_sha256="a"*64)
          assert verdict["verdict"] == VERIFIED_NATIVE, verdict
          print(f"EVIDEX_VERIFIED_NATIVE artifacts={len(evidence['artifacts'])}")
          PY

  homs-main-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Byron2306/NoEdge-Multi-Hymark
          ref: a3ea3f627d860fc7b13e2d95f6632f914938c8de
          path: external/homs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HOMS runtime
        run: python -m pip install -r external/homs/requirements.txt
      - name: Execute canonical HOMS demo workflow
        working-directory: external/homs/Marker
        run: python scripts/run_demo_assessment.py
      - name: Seal HOMS assessment and learning artifacts through DIO Phase 7
        run: |
          python - <<'PY'
          from pathlib import Path
          from presence_core.organ_adapter_gauntlet import seal_native_execution, validate_execution_evidence, VERIFIED_NATIVE
          out = Path("external/homs/Marker/output")
          summary = out / "workflow_summary.json"
          kb = out / "knowledge_base.pkl"
          assert summary.is_file(), summary
          assert kb.is_file(), kb
          ref = "external-repo:Byron2306/NoEdge-Multi-Hymark@a3ea3f627d860fc7b13e2d95f6632f914938c8de"
          assessment = seal_native_execution(
              "homs_assessment",
              fulfilment_request_sha256="b"*64,
              execution_profile_sha256="c"*64,
              artifacts=[{"artifact_id":"homs-workflow-summary","kind":"application/json","path":summary}],
              evidence_refs=[ref],
          )
          learning = seal_native_execution(
              "homs_learning",
              fulfilment_request_sha256="d"*64,
              execution_profile_sha256="e"*64,
              artifacts=[{"artifact_id":"homs-knowledge-base","kind":"application/octet-stream","path":kb}],
              evidence_refs=[ref],
          )
          av = validate_execution_evidence("homs_assessment", assessment, expected_request_sha256="b"*64, expected_profile_sha256="c"*64)
          lv = validate_execution_evidence("homs_learning", learning, expected_request_sha256="d"*64, expected_profile_sha256="e"*64)
          assert av["verdict"] == VERIFIED_NATIVE, av
          assert lv["verdict"] == VERIFIED_NATIVE, lv
          print("HOMS_ASSESSMENT_VERIFIED_NATIVE")
          print("HOMS_LEARNING_VERIFIED_NATIVE")
          PY

  nichefoundry-main-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Byron2306/NicheFoundry
          ref: 7528d8cdee17c5b6fbe35236b71b8e2191bb108a
          path: external/nichefoundry
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Execute canonical NicheFoundry backend autopilot
        working-directory: external/nichefoundry
        run: node scripts/backend_autopilot.js "Dinosaur" puzzle_planet
      - name: Seal NicheFoundry campaign artifacts through DIO Phase 7
        run: |
          python - <<'PY'
          from pathlib import Path
          from presence_core.organ_adapter_gauntlet import seal_native_execution, validate_execution_evidence, VERIFIED_NATIVE
          episodes = [p for p in Path("external/nichefoundry/episodes").iterdir() if p.is_dir()]
          assert episodes, "NicheFoundry produced no episode directory"
          episode = max(episodes, key=lambda p: p.stat().st_mtime_ns)
          wanted = ["brief.json", "script_package.json", "timing_plan.json", "visual_plan.json", "asset_manifest.json"]
          artifacts = [episode / name for name in wanted if (episode / name).is_file()]
          assert len(artifacts) >= 4, [p.name for p in artifacts]
          evidence = seal_native_execution(
              "nichefoundry_campaign",
              fulfilment_request_sha256="f"*64,
              execution_profile_sha256="1"*64,
              artifacts=[{"artifact_id": f"niche-{p.stem}", "kind": "application/json", "path": p} for p in artifacts],
              evidence_refs=["external-repo:Byron2306/NicheFoundry@7528d8cdee17c5b6fbe35236b71b8e2191bb108a"],
          )
          verdict = validate_execution_evidence("nichefoundry_campaign", evidence, expected_request_sha256="f"*64, expected_profile_sha256="1"*64)
          assert verdict["verdict"] == VERIFIED_NATIVE, verdict
          print(f"NICHEFOUNDRY_VERIFIED_NATIVE artifacts={len(evidence['artifacts'])}")
          PY

  document-studio-provider-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Document Studio runtime
        run: |
          python -m pip install pytest python-docx pillow python-pptx
          sudo apt-get update
          sudo apt-get install -y libreoffice-writer
      - name: Verify Document Studio Ollama provider contract
        run: python -m pytest -q tests/test_document_studio_ollama_provider.py
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull tiny Qwen
        run: |
          ollama serve >/tmp/ollama-docstudio.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull qwen2.5:1.5b
      - name: Execute real Document Studio technical-edit pipeline
        run: |
          mkdir -p /tmp/document-studio-input /tmp/document-studio-output
          cat > /tmp/document-studio-input/source.txt <<'EOF'
          Field Sampling Procedure

          The technician record the sample code and collection time before placing the bottle in the cooler. The bottle must remain between 2 and 8 degrees Celsius during transport.
          EOF
          cat > /tmp/document-studio-input/request.json <<'EOF'
          {
            "schema": "dio.document_studio.request.v1",
            "job_id": "PHASE7-DOC-OLLAMA-001",
            "title": "Field Sampling Procedure",
            "document_path": "source.txt",
            "service": "technical_edit",
            "source_language": "English",
            "audience": "Municipal field technicians",
            "document_domain": "Water-quality operations",
            "style_standard": "Plain South African technical English; preserve all operational facts and thresholds.",
            "protected_tokens": ["2", "8"],
            "preferred_terms": [],
            "owner_authorized": true,
            "remote_processing_approved": true,
            "certified_translation_required": false,
            "human_language_review_required": false,
            "provider": "ollama",
            "ollama_model": "qwen2.5:1.5b",
            "ollama_url": "http://127.0.0.1:11434",
            "format_channels": ["docx", "html"]
          }
          EOF
          python scripts/run_document_studio.py /tmp/document-studio-input/request.json --out-root /tmp/document-studio-output
      - name: Verify held Document Studio review pack
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          job = Path("/tmp/document-studio-output/PHASE7-DOC-OLLAMA-001")
          receipt = json.loads((job / "DOCUMENT_STUDIO_RECEIPT.json").read_text())
          qa = json.loads((job / "DOCUMENT_STUDIO_QA.json").read_text())
          assert receipt["status"] == "human_review_required", receipt
          assert receipt["processing"]["provider"] == "ollama", receipt
          assert receipt["release"]["delivery_released"] is False, receipt
          assert receipt["release"]["human_approval_required"] is True, receipt
          assert qa["release_readiness"] == "blocked_pending_human_approval", qa
          required = [
              job / "CLEAN_EDITED_COPY.docx",
              job / "REDLINE_REVIEW_COPY.docx",
              job / "DOCUMENT_STUDIO_QA.json",
              job / "DOCUMENT_STUDIO_RECEIPT.json",
              job / "PHASE7-DOC-OLLAMA-001_DOCUMENT_STUDIO_REVIEW_PACK.zip",
          ]
          assert all(p.is_file() and p.stat().st_size > 0 for p in required), required
          print("DOCUMENT_STUDIO_OLLAMA_PIPELINE_EXECUTED")
          PY


  sophia-main-repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Byron2306/Sophia-AI
          ref: c1aa915560599f7d6cef0ff41e6a7b0787334376
          path: external/sophia
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and pull tiny Qwen
        run: |
          ollama serve >/tmp/ollama.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && break
            sleep 1
          done
          ollama pull qwen2.5:0.5b
      - name: Start canonical Sophia 7070
        env:
          PRESENCE_PORT: '7070'
          OLLAMA_URL: http://127.0.0.1:11434
          OLLAMA_MODEL: qwen2.5:0.5b
        working-directory: external/sophia
        run: |
          python arda_os/backend/services/presence_server.py >/tmp/sophia-presence.log 2>&1 &
          for i in {1..45}; do
            curl -fsS http://127.0.0.1:7070/api/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:7070/api/health >/dev/null
      - name: Execute live Sophia specialist review
        working-directory: external/sophia
        run: python tests/run_dio_product_review_live.py /tmp/sophia-live-review.json
      - name: Seal Sophia witness through DIO Phase 7
        run: |
          python - <<'PY'
          from pathlib import Path
          from presence_core.organ_adapter_gauntlet import seal_native_execution, validate_execution_evidence, VERIFIED_NATIVE
          witness = Path("/tmp/sophia-live-review.json")
          assert witness.is_file() and witness.stat().st_size > 0
          ref = "external-repo:Byron2306/Sophia-AI@c1aa915560599f7d6cef0ff41e6a7b0787334376"
          evidence = seal_native_execution(
              "sophia_review",
              fulfilment_request_sha256="2"*64,
              execution_profile_sha256="3"*64,
              artifacts=[{"artifact_id":"sophia-live-review","kind":"application/json","path":witness}],
              evidence_refs=[ref, "ollama-model:qwen2.5:0.5b", "presence-port:7070"],
          )
          verdict = validate_execution_evidence("sophia_review", evidence, expected_request_sha256="2"*64, expected_profile_sha256="3"*64)
          assert verdict["verdict"] == VERIFIED_NATIVE, verdict
          print("SOPHIA_REVIEW_VERIFIED_NATIVE")
          PY
