name: DIO Customer Journey Phase 2

on:
  push:
    branches:
      - "agent/dio-customer-journey-phase2"
    paths:
      - "presence_core/intake_scope_quote.py"
      - "presence_core/journey_core.py"
      - "products/commercial_pricing_registry.py"
      - "tests/test_customer_journey_phase2.py"
      - "docs/DIO_CUSTOMER_JOURNEY_PHASE2.md"
      - ".github/workflows/dio-customer-journey-phase2.yml"
  pull_request:
    paths:
      - "presence_core/intake_scope_quote.py"
      - "presence_core/journey_core.py"
      - "products/commercial_pricing_registry.py"
      - "tests/test_customer_journey_phase2.py"
      - "docs/DIO_CUSTOMER_JOURNEY_PHASE2.md"
      - ".github/workflows/dio-customer-journey-phase2.yml"

jobs:
  intake-scope-quote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Compile Phase 2 contracts
        run: |
          python -m py_compile \
            presence_core/journey_core.py \
            products/commercial_pricing_registry.py \
            tests/test_customer_journey_phase2.py
          if [ -f presence_core/intake_scope_quote.py ]; then
            python -m py_compile presence_core/intake_scope_quote.py
          fi
      - name: Run Phase 2 contract tests
        run: python -m pytest -q tests/test_customer_journey_phase2.py
