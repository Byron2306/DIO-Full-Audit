name: DIO Phase 0-1 + Incarnation + Fusion Wave 1 Gauntlet

on:
  push:
    branches:
      - agent/dio-product-platform-expansion
  pull_request:
    paths:
      - "config/dio_system_sources.json"
      - "config/dio_workspace.json"
      - "config/dio_product_portfolio.json"
      - "config/dio_fusion_registry.json"
      - "config/dio_fusion_bindings.json"
      - "config/presence.json"
      - "config/legalis/**"
      - "config/media_layers.json"
      - "config/routes.json"
      - "products/**"
      - "fusion/**"
      - "presence_core/**"
      - "adapters/document_studio/conversion.py"
      - "adapters/legalis/**"
      - "adapters/seraph/**"
      - "schemas/dio_system_snapshot.schema.json"
      - "schemas/dio_unified_workspace.schema.json"
      - "schemas/dio_governed_case*.schema.json"
      - "schemas/dio_legalis*.schema.json"
      - "schemas/dio_seraph_challenge.schema.json"
      - "schemas/dio_fusion_registry.schema.json"
      - "schemas/dio_fusion_assertion.schema.json"
      - "schemas/dio_fusion_bindings.schema.json"
      - "scripts/capture_system_snapshot.py"
      - "scripts/build_unified_dio_workspace.py"
      - "scripts/check_incarnation.py"
      - "scripts/check_fusion_wave1.py"
      - "scripts/dio_workspace.py"
      - "scripts/serve_presence_bridge.py"
      - "scripts/convert_document.py"
      - "scripts/manage_legalis.py"
      - "scripts/reconcile_product_portfolio.py"
      - "scripts/plan_product_layer.py"
      - "scripts/build_portfolio_campaigns.py"
      - "tests/test_product_portfolio.py"
      - "tests/test_governed_case_v2.py"
      - "tests/test_case_migration.py"
      - "tests/test_system_snapshot.py"
      - "tests/test_unified_workspace.py"
      - "tests/test_document_conversion.py"
      - "tests/test_legalis.py"
      - "tests/test_presence_authority.py"
      - "tests/test_presence_vesper.py"
      - "tests/test_seraph_challenge.py"
      - "tests/test_fusion_registry.py"
      - "tests/test_fusion_wave1.py"
      - ".github/workflows/dio-phase01.yml"

permissions:
  contents: read

jobs:
  phase01:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema python-docx httpx fastapi requests
      - name: Compile Phase 0, 1, Incarnation and Fusion Python
        run: |
          python -m py_compile \
            products/registry.py \
            products/governed_case.py \
            products/case_migration.py \
            fusion/contracts.py \
            fusion/case_projection.py \
            adapters/document_studio/conversion.py \
            adapters/legalis/service.py \
            adapters/legalis/valinor_bridge.py \
            adapters/seraph/challenge.py \
            presence_core/authority.py \
            presence_core/engine.py \
            presence_core/llm.py \
            presence_core/router.py \
            scripts/capture_system_snapshot.py \
            scripts/build_unified_dio_workspace.py \
            scripts/check_incarnation.py \
            scripts/check_fusion_wave1.py \
            scripts/dio_workspace.py \
            scripts/serve_presence_bridge.py \
            scripts/convert_document.py \
            scripts/manage_legalis.py \
            scripts/reconcile_product_portfolio.py \
            scripts/plan_product_layer.py \
            scripts/build_portfolio_campaigns.py
      - name: Validate JSON and JSON Schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema.validators import validator_for
          paths = [
              Path("config/dio_system_sources.json"), Path("config/dio_workspace.json"), Path("config/dio_product_portfolio.json"),
              Path("config/dio_fusion_registry.json"), Path("config/dio_fusion_bindings.json"), Path("config/presence.json"),
              Path("config/legalis/legal_identity.json"), Path("config/legalis/requirement_registry.json"), Path("config/media_layers.json"), Path("config/routes.json"),
              Path("schemas/dio_system_snapshot.schema.json"), Path("schemas/dio_unified_workspace.schema.json"), Path("schemas/dio_governed_case.schema.json"),
              Path("schemas/dio_governed_case_v2.schema.json"), Path("schemas/dio_product_request.schema.json"), Path("schemas/dio_legalis_decision.schema.json"),
              Path("schemas/dio_legalis_request.schema.json"), Path("schemas/dio_seraph_challenge.schema.json"), Path("schemas/dio_fusion_registry.schema.json"),
              Path("schemas/dio_fusion_assertion.schema.json"), Path("schemas/dio_fusion_bindings.schema.json")]
          for path in paths:
              payload = json.loads(path.read_text(encoding="utf-8"))
              if path.parent.name == "schemas": validator_for(payload).check_schema(payload)
              print(f"PASS {path}")
          PY
      - name: Validate workspace and fusion registries against schemas
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          pairs = [
              ("schemas/dio_unified_workspace.schema.json", "config/dio_workspace.json"),
              ("schemas/dio_fusion_registry.schema.json", "config/dio_fusion_registry.json"),
              ("schemas/dio_fusion_bindings.schema.json", "config/dio_fusion_bindings.json"),
          ]
          for schema_path, payload_path in pairs:
              schema = json.loads(Path(schema_path).read_text(encoding="utf-8"))
              payload = json.loads(Path(payload_path).read_text(encoding="utf-8"))
              Draft202012Validator(schema).validate(payload)
              print(f"PASS {payload_path} against {schema_path}")
          PY
      - name: Smoke test Legalis CLI
        run: |
          python scripts/manage_legalis.py samples/legalis/linkedin_vetting.request.json --dry-run
          python scripts/manage_legalis.py samples/legalis/public_marketing.request.json --dry-run
      - name: Run Phase 0 and 1 tests
        run: |
          python -m pytest -q \
            tests/test_product_portfolio.py \
            tests/test_governed_case_v2.py \
            tests/test_case_migration.py \
            tests/test_system_snapshot.py \
            tests/test_unified_workspace.py \
            tests/test_document_conversion.py \
            tests/test_legalis.py
      - name: Run Incarnation tests
        run: |
          python -m pytest -q \
            tests/test_presence_authority.py \
            tests/test_presence_vesper.py \
            tests/test_seraph_challenge.py \
            tests/test_fusion_registry.py
      - name: Run Fusion Wave 1 tests
        run: python -m pytest -q tests/test_fusion_wave1.py
