name: DIO META Product Layer Gauntlet

on:
  push:
    branches:
      - agent/dio-product-platform-expansion
  pull_request:
    paths:
      - "products/meta.py"
      - "config/dio_meta_products.json"
      - "schemas/dio_meta_products.schema.json"
      - "scripts/check_meta_product_layer.py"
      - "scripts/run_meta_product_layer.py"
      - "tests/test_meta_products.py"
      - "docs/DIO_META_PRODUCT_LAYER.md"
      - ".github/workflows/dio-meta-products.yml"

permissions:
  contents: read

jobs:
  meta-products:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema python-docx httpx fastapi requests

      - name: Compile META product layer
        run: |
          python -m py_compile \
            products/meta.py \
            scripts/check_meta_product_layer.py \
            scripts/run_meta_product_layer.py

      - name: Validate META product registry schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("schemas/dio_meta_products.schema.json").read_text(encoding="utf-8"))
          payload = json.loads(Path("config/dio_meta_products.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(payload)
          print("PASS META product registry schema")
          PY

      - name: Re-run Phase 0 and 1 suite
        run: |
          python -m pytest -q \
            tests/test_product_portfolio.py \
            tests/test_governed_case_v2.py \
            tests/test_case_migration.py \
            tests/test_system_snapshot.py \
            tests/test_unified_workspace.py \
            tests/test_document_conversion.py \
            tests/test_legalis.py

      - name: Re-run Incarnation suite
        run: |
          python -m pytest -q \
            tests/test_presence_authority.py \
            tests/test_presence_vesper.py \
            tests/test_seraph_challenge.py \
            tests/test_fusion_registry.py

      - name: Re-run Fusion Waves 1 to 9
        run: |
          python -m pytest -q tests/test_fusion_wave1.py
          python -m pytest -q tests/test_framework_engine.py
          python -m pytest -q tests/test_evidence_intelligence.py
          python -m pytest -q tests/test_authority_execution_plane.py
          python -m pytest -q tests/test_vertical_executors.py
          python -m pytest -q tests/test_cross_organ_composition.py
          python -m pytest -q tests/test_evidence_authority_twin.py
          python -m pytest -q tests/test_continuous_assurance.py tests/test_continuous_assurance_watcher.py
          python -m pytest -q tests/test_capitalroom_proof.py tests/test_capitalroom_integrity.py

      - name: Run META Product Layer tests
        run: python -m pytest -q tests/test_meta_products.py
