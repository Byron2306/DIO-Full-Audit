name: DIO Phase 9 GoldenEye Control Deck Portfolio OS

on:
  push:
    branches:
      - agent/dio-phase9-control-deck-portfolio-os
  pull_request:
    paths:
      - "config/portfolio/control_deck.json"
      - "config/portfolio/suites.json"
      - "config/portfolio/maturity_vocabulary.json"
      - "config/products/manifests/**"
      - "products/control_deck.py"
      - "products/control_deck_gauntlet.py"
      - "products/meta_runtime.py"
      - "products/meta_runtime_gauntlet.py"
      - "dashboard/goldeneye-portfolio.*"
      - "dashboard/assets/dio-logo-cockpit.svg"
      - "schemas/dio_control_deck_snapshot.schema.json"
      - "scripts/run_control_deck_phase9.py"
      - "scripts/serve_goldeneye_portfolio.py"
      - "tests/test_control_deck_phase9.py"
      - ".github/workflows/dio-control-deck-phase9.yml"

permissions:
  contents: read

jobs:
  phase9:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check pytest jsonschema
      - name: Compile Phase 9 sources
        run: python -m py_compile products/control_deck.py products/control_deck_gauntlet.py scripts/run_control_deck_phase9.py scripts/serve_goldeneye_portfolio.py tests/test_control_deck_phase9.py
      - name: Validate GoldenEye JavaScript
        run: node --check dashboard/goldeneye-portfolio.js
      - name: Run Phase 0-8 regression gates
        run: |
          python scripts/validate_product_constitution.py
          python scripts/validate_product_compiler.py
          python scripts/validate_work_pattern_runtime.py
          python scripts/validate_obligation_engine.py
          python scripts/validate_contractproof_phase5.py
          python scripts/validate_obligation_family_phase6.py
          python scripts/run_reference_incarnation_gauntlet.py --output /tmp/dio-phase7-regression
          python scripts/run_meta_runtime_phase8.py --output /tmp/dio-phase8-regression
      - name: Run Phase 9 tests
        run: python -m pytest -q tests/test_control_deck_phase9.py
      - name: Emit Phase 9 acceptance receipt
        run: python scripts/run_control_deck_phase9.py --output state/control_deck
