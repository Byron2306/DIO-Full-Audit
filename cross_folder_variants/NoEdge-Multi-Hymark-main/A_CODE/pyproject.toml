[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "homs"
version = "3.0.0"
description = "Hybrid Offline Marking System - NWU UTEW221"
requires-python = ">=3.8"
dependencies = [
    "pybryt>=0.7.0",
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "pyyaml>=5.4.0",
    "nbformat>=5.0.0",
    "nbconvert>=6.0.0",
    "jupyter_client>=6.0.0"
]

[project.scripts]
homs = "main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["homs*"]
