name: DIO Customer Journey Phase 6

on:
  push:
    branches:
      - agent/dio-customer-journey-phase6
  pull_request:
    paths:
      - 'presence_core/vesper_journey_runtime.py'
      - 'tests/test_customer_journey_phase6.py'
      - 'docs/DIO_CUSTOMER_JOURNEY_PHASE6.md'
      - 'docs/superpowers/plans/2026-09-17-customer-journey-phase6-vesper-runtime.md'
      - '.github/workflows/dio-customer-journey-phase6.yml'

jobs:
  phase6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest jsonschema
      - name: Compile Phase 6 runtime
        run: |
          python -m py_compile \
            presence_core/vesper_journey_runtime.py \
            tests/test_customer_journey_phase6.py
      - name: Verify Customer Journey Phases 1 through 6
        run: |
          python -m pytest -q \
            tests/test_customer_journey_phase1.py \
            tests/test_customer_journey_phase2.py \
            tests/test_customer_journey_phase3.py \
            tests/test_customer_journey_phase4.py \
            tests/test_customer_journey_phase5.py \
            tests/test_customer_journey_phase6.py
      - name: Acceptance token
        run: echo DIO_CUSTOMER_JOURNEY_PHASE6_VESPER_RUNTIME_VERIFIED
