name: DIO Customer Journey Phase 5

on:
  push:
    branches:
      - agent/dio-customer-journey-phase5
  pull_request:
    paths:
      - 'presence_core/deliverable_release_v2.py'
      - 'tests/test_customer_journey_phase5.py'
      - 'docs/DIO_CUSTOMER_JOURNEY_PHASE5.md'
      - 'docs/superpowers/plans/2026-09-17-customer-journey-phase5-deliverable-release-v2.md'
      - '.github/workflows/dio-customer-journey-phase5.yml'

jobs:
  phase5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Phase 5 contract
        run: |
          python -m py_compile \
            presence_core/deliverable_release_v2.py \
            tests/test_customer_journey_phase5.py
      - name: Verify Phase 4 and Phase 5 journey contracts
        run: |
          python -m pytest -q \
            tests/test_customer_journey_phase4.py \
            tests/test_customer_journey_phase5.py \
            tests/test_fulfilment_release_case_stage.py \
            tests/test_fulfilment_delivery_completion.py \
            tests/test_presence_bridge_fulfilment_completion.py
      - name: Acceptance token
        run: echo DIO_CUSTOMER_JOURNEY_PHASE5_DELIVERABLE_RELEASE_V2_VERIFIED
