[default]
elasticsearch=http://127.0.0.1:9201
rotateIndex=daily
passwordSecret=metatron-local-lab-secret
interface=seraph-br0
pcapDir=/opt/arkime/raw
maxFileSizeG=1
maxFileTimeM=5
tcpTimeout=30
tcpSaveTimeout=60
udpTimeout=10
icmpTimeout=10
maxStreams=100000
maxPackets=10000
freeSpaceG=5%
dropUser=root
dropGroup=root
parseSMTP=true
parseSMB=true
parseQSValue=true
supportSha256=true
snapLen=65535
pcapReadMethod=libpcap
plugins=tagger.so
