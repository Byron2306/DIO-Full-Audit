name: DIO Phase 16.1 Media Incarnation

on:
  push:
    branches:
      - agent/dio-phase16-1-media-incarnation
  pull_request:
    paths:
      - "products/media_incarnation.py"
      - "products/media_incarnation_gauntlet.py"
      - "scripts/run_media_incarnation_phase16_1.py"
      - "tests/test_media_incarnation_phase16_1.py"
      - "scripts/run_nichefoundry_jobs.py"
      - "config/portfolio/capability_catalog.json"
      - ".github/workflows/dio-media-incarnation-phase16-1.yml"

jobs:
  phase16_1:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install deterministic media system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Python dependencies
        run: python -m pip install pytest pillow reportlab jsonschema
      - name: Verify offline narration backend
        run: ffmpeg -hide_banner -filters 2>&1 | grep -q " flite "
      - name: Compile Phase 16.1 sources
        run: python -m py_compile products/media_incarnation.py products/media_incarnation_gauntlet.py scripts/run_media_incarnation_phase16_1.py tests/test_media_incarnation_phase16_1.py
      - name: Run Phase 16 regression
        run: python -m pytest -q tests/test_product_incarnation_studio_phase16.py
      - name: Run Phase 16.1 media tests
        run: python -m pytest -q tests/test_media_incarnation_phase16_1.py
      - name: Run Phase 16.1 acceptance gauntlet
        run: python scripts/run_media_incarnation_phase16_1.py --output /tmp/dio-phase16-1-media-incarnation
