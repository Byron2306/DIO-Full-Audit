{% extends "base.html" %}
{% block content %}
  <div class="card">
    <div class="card-body">
      <h3>Batch Results</h3>
      <table class="table table-striped">
        <thead><tr><th>Student</th><th>Status</th><th>Score</th></tr></thead>
        <tbody>
          {% for r in results %}
            <tr>
              <td>{{ r.student_id }}</td>
              <td>{{ r.status }}</td>
              <td>{{ r.final_score if r.status=='success' else 'N/A' }}</td>
            </tr>
          {% endfor %}
        </tbody>
      </table>
      <a href="/" class="btn btn-secondary">Back</a>
    </div>
  </div>
{% endblock %}
