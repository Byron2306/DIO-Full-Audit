name: Vesper Conversational Presence v2

on:
  push:
    branches:
      - agent/vesper-lingua-conversational-presence-v2
  pull_request:
    paths:
      - 'presence_core/**'
      - 'products/commercial_pricing_registry.py'
      - 'products/hivenance_commercial_pricing.py'
      - 'adapters/lingua/**'
      - 'config/vesper_voice_profiles.json'
      - 'config/atlas/dio_meta_incarnation_crosswalk.csv'
      - 'tests/test_presence_engine.py'
      - 'tests/test_vesper_conversation_*.py'
      - 'tests/test_vesper_customer_cases.py'
      - 'tests/test_vesper_operator_truth.py'
      - 'tests/test_vesper_commercial_pricing.py'
      - 'tests/test_vesper_commercial_pricing_registry.py'
      - 'tests/test_vesper_hivenance_commercial.py'
      - 'tests/test_vesper_evidex_invoice_bridge.py'
      - 'tests/test_vesper_lingua_conversation.py'
      - 'tests/test_vesper_conversational_presence_v2.py'
      - 'tests/test_vesper_voice.py'
      - 'tests/test_vesper_telegram_voice.py'
      - 'tests/test_vesper_voice_ingress.py'
      - 'scripts/serve_presence_bridge.py'
      - 'scripts/sync_vesper_presence_edge.py'
      - '.github/workflows/vesper-conversational-presence-v2.yml'

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest httpx
      - name: Run Vesper conversation core contracts
        env:
          PYTHONPATH: .
        run: >-
          python -m pytest -q
          tests/test_presence_engine.py
          tests/test_vesper_conversation_state.py
          tests/test_vesper_lingua_conversation.py
          tests/test_vesper_conversation_knowledge.py
          tests/test_vesper_conversation_crystals.py
          tests/test_vesper_voice.py
          tests/test_vesper_telegram_voice.py
          tests/test_vesper_voice_ingress.py
          tests/test_vesper_customer_cases.py
          tests/test_vesper_operator_truth.py
          tests/test_vesper_commercial_pricing.py
          tests/test_vesper_commercial_pricing_registry.py
          tests/test_vesper_hivenance_commercial.py
          tests/test_vesper_evidex_invoice_bridge.py
