name: DIO Metamorphic Adaptation Gauntlet

on:
  pull_request:
    branches:
      - agent/dio-public-launch-rail
  push:
    branches:
      - agent/dio-metamorphic-adaptation-gauntlet

jobs:
  experiment-red-green:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            experiments
            tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest jsonschema
      - name: Run metamorphic adaptation focused tests
        run: |
          python -m pytest -q \
            tests/test_metamorphic_adaptation_contracts.py \
            tests/test_metamorphic_adaptation_freeze_state.py \
            tests/test_metamorphic_adaptation_atlas.py \
            tests/test_metamorphic_adaptation_runner_lineage.py \
            tests/test_metamorphic_adaptation_evaluation.py
