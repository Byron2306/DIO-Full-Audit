<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920">
  <rect width="1440" height="920" fill="#0b1118"/>
  <rect x="72" y="54" width="316" height="38" rx="19" fill="#5fd1d8"/>
<text x="230" y="77.76" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="800" fill="#071014">HOMS · DRAFT CANDIDATE SET</text>
  <text x="72" y="158" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="46" font-weight="900" fill="#f5f8fa"><tspan x="72" dy="0">A reviewable exam and memo for every grade</tspan></text>
  <text x="74" y="258" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" fill="#aab7c3"><tspan x="74" dy="0">Subject draw seed 20261101 · 12 grades · CAPS source pages bound to each question</tspan></text>
  <defs><marker id="dio-visual-arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#5fd1d8"/></marker></defs>
<rect x="72" y="366" width="226" height="86" rx="10" fill="#111b25" stroke="#5fd1d8" stroke-width="2"/>
<text x="185" y="415" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#f5f8fa"><tspan x="185" dy="0">Seeded CAPS subject draw</tspan></text>
<path d="M306 409 L329.5 409" stroke="#5fd1d8" stroke-width="3" marker-end="url(#dio-visual-arrow)"/>
<rect x="339.5" y="366" width="226" height="86" rx="10" fill="#111b25" stroke="#5fd1d8" stroke-width="2"/>
<text x="452.5" y="415" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#f5f8fa"><tspan x="452.5" dy="0">Question-level source map</tspan></text>
<path d="M573.5 409 L597 409" stroke="#5fd1d8" stroke-width="3" marker-end="url(#dio-visual-arrow)"/>
<rect x="607" y="366" width="226" height="86" rx="10" fill="#111b25" stroke="#5fd1d8" stroke-width="2"/>
<text x="720" y="415" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#f5f8fa"><tspan x="720" dy="0">Exam + marking memo</tspan></text>
<path d="M841 409 L864.5 409" stroke="#5fd1d8" stroke-width="3" marker-end="url(#dio-visual-arrow)"/>
<rect x="874.5" y="366" width="226" height="86" rx="10" fill="#111b25" stroke="#5fd1d8" stroke-width="2"/>
<text x="987.5" y="415" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#f5f8fa"><tspan x="987.5" dy="0">PDF and mark checks</tspan></text>
<path d="M1108.5 409 L1132 409" stroke="#5fd1d8" stroke-width="3" marker-end="url(#dio-visual-arrow)"/>
<rect x="1142" y="366" width="226" height="86" rx="10" fill="#111b25" stroke="#5fd1d8" stroke-width="2"/>
<text x="1255" y="415" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="800" fill="#f5f8fa"><tspan x="1255" dy="0">Educator moderation</tspan></text>
  <rect x="72" y="532" width="420" height="220" rx="16" fill="#111b25" stroke="#29404f" stroke-width="1.5" opacity="1"/>
<rect x="72" y="532" width="6" height="220" rx="3" fill="#5fd1d8"/>
<text x="94" y="566" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#f5f8fa"><tspan x="94" dy="0">Reproducible assignment</tspan></text>
<text x="94" y="614" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#aab7c3"><tspan x="94" dy="0">Subjects are drawn without replacement</tspan><tspan x="94" dy="20">within each CAPS phase. The seed and</tspan><tspan x="94" dy="20">reconstructed draw are included.</tspan></text>
<rect x="510" y="532" width="420" height="220" rx="16" fill="#111b25" stroke="#29404f" stroke-width="1.5" opacity="1"/>
<rect x="510" y="532" width="6" height="220" rx="3" fill="#78d9a5"/>
<text x="532" y="566" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#f5f8fa"><tspan x="532" dy="0">Bounded source evidence</tspan></text>
<text x="532" y="614" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#aab7c3"><tspan x="532" dy="0">Each question maps to a CAPS topic and</tspan><tspan x="532" dy="20">cited physical page with a matching</tspan><tspan x="532" dy="20">page-text hash.</tspan></text>
<rect x="948" y="532" width="420" height="220" rx="16" fill="#111b25" stroke="#29404f" stroke-width="1.5" opacity="1"/>
<rect x="948" y="532" width="6" height="220" rx="3" fill="#f0b95b"/>
<text x="970" y="566" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="800" fill="#f5f8fa"><tspan x="970" dy="0">Human decision still</tspan><tspan x="970" dy="24">required</tspan></text>
<text x="970" y="614" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="500" fill="#aab7c3"><tspan x="970" dy="0">Mechanical and print checks pass.</tspan><tspan x="970" dy="20">Educator validity and classroom</tspan><tspan x="970" dy="20">release remain pending.</tspan></text>
  <text x="74" y="824" text-anchor="start" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="700" fill="#aab7c3"><tspan x="74" dy="0">Original draft assessments · not DBE examinations · no classroom release authorized</tspan></text>
</svg>
